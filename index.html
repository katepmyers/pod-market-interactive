<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POD Market Interactive Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Roboto Slab", Georgia, serif;
      text-align: center;
      padding: 30px;
      color: #000000;
    }
    h1 {
      color: #000000;
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
    }
    button {
      background-color: #5D1725;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 14px 20px;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background-color: #440000;
    }
  </style>
</head>
<body>
  <h1>Get a Random POD Product</h1>
  <p id="product">Click the button to see a random item.</p>
  <button type="button" onclick="showItem()">
    Show me another item
  </button>
  <script>
    const products = [
      "Energy drink: $5",
      "Ramen: $2.25",
      "Chips: $3.75",
      "Water: $2.00"
    ];
    function showItem() {
      const randomNumber = Math.floor(Math.random() * products.length);
      document.getElementById("product").textContent = products[randomNumber];
    }
  </script>
</body>
</html>
