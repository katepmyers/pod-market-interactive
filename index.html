<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POD Market Interactive Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Roboto Slab", Georgia, serif;
      text-align: center;
      padding: 30px;
      color: #000000;
    }
    h1 {
      color: #000000;
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
    }
    button {
      background-color: #5D1725;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 14px 20px;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background-color: #440000;
    }
    #product-image {
      display: none;
      width: auto;
      max-width: 100%;
      height: 100px;
      object-fit: contain;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>Get a Random POD Product</h1>
  <img id="product-image" src="" alt="">
  <p id="product">Click the button to see a random item.</p>
  <button type="button" onclick="showItem()">
    Show me another item
  </button>
  <script>
  let products = [];
  let previousIndex = -1;
  fetch("data.json")
    .then(response => {
      if (!response.ok) {
        throw new Error("Could not load the product list.");
      }
      return response.json();
    })
    .then(data => {
      products = data;
    })
    .catch(error => {
      console.error(error);
      document.getElementById("product").textContent =
        "Sorry, the products could not be loaded.";
    });

  function showItem() {
    if (products.length === 0) {
      document.getElementById("product").textContent =
        "The product list is still loading. Please try again.";
      return;
    }

    let randomNumber;
    do {
      randomNumber = Math.floor(Math.random() * products.length);
    } while (products.length > 1 && randomNumber === previousIndex);
    previousIndex = randomNumber;
    const item = products[randomNumber];
    document.getElementById("product").textContent =
      item.name + ": " + item.price + " (checked " + item.date + ")";
    const image = document.getElementById("product-image");
    image.src = item.image;
    image.alt = "POD Market photo for " + item.name;
    image.style.display = "block";
  }
</script>
</body>
</html>
